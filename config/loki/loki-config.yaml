# Loki — single-binary, filesystem storage, for terramaster (192.168.0.172).
# Deployed as service `loki` in the `tm` compose project (docker-compose-monitoring.yml).
# Data lives on /mnt/NVMe2/loki (539 GB free) — NOT the OS SSD.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 90 days of retention — the "what happened before I noticed" window.
  retention_period: 2160h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  volume_enabled: true
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

querier:
  # 7.5 GiB box — keep query concurrency modest.
  max_concurrent: 4

analytics:
  reporting_enabled: false
