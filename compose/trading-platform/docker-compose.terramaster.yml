name: trading-platform

x-application: &application
  image: trading-platform:${TRADING_IMAGE_TAG:-local}
  env_file:
    - path: deployment.env
      required: false
  environment:
    TRADING_MODE: observe
    TRADING_POSTGRES_HOST: postgres
    TRADING_POSTGRES_PORT: "5432"
    TRADING_POSTGRES_USER: ${POSTGRES_USER:-trading}
    TRADING_POSTGRES_DB: ${POSTGRES_DB:-trading}
    TRADING_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    TRADING_PARQUET_PATH: /data/parquet
    TRADING_EQUITY_DOCUMENT_MANIFEST: /app/docs/examples/asx-starter-annual-reports-2025.json
  secrets:
    - postgres_password
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - trading_internal
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - log_min_duration_statement=1000
    volumes:
      - ${TRADING_DATA_ROOT:-/mnt/NVMe2/trading-platform}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 768m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    networks:
      - trading_internal
    logging:
      options:
        max-size: 10m
        max-file: "3"

  collector:
    <<: *application
    build:
      context: ..
    command: ["trading-collector"]
    volumes:
      - ${TRADING_DATA_ROOT:-/mnt/NVMe2/trading-platform}/parquet:/data/parquet
    ports:
      - ${TRADING_METRICS_BIND:-127.0.0.1}:9108:9108
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/trading-collector-health && find /tmp/trading-collector-health -mmin -2 | grep -q .
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 3m
    mem_limit: 384m
    cpus: 0.50
    logging:
      options:
        max-size: 10m
        max-file: "3"

  api:
    <<: *application
    command: ["trading-api"]
    ports:
      - ${TRADING_API_BIND:-127.0.0.1}:8092:8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 3m
    mem_limit: 256m
    cpus: 0.25
    networks:
      - trading_internal
      - dashboard_shared
    logging:
      options:
        max-size: 10m
        max-file: "3"

  ui:
    image: trading-platform-ui:${TRADING_UI_IMAGE_TAG:-local}
    build:
      context: ../ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${TRADING_UI_BIND:-127.0.0.1}:8093:8080
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dashboard_shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 15s
    mem_limit: 128m
    cpus: 0.25
    logging:
      options:
        max-size: 10m
        max-file: "3"

  maintenance:
    <<: *application
    command: ["trading-maintenance"]
    volumes:
      - ${TRADING_DATA_ROOT:-/mnt/NVMe2/trading-platform}/parquet:/data/parquet
    mem_limit: 256m
    cpus: 0.25
    logging:
      options:
        max-size: 10m
        max-file: "3"

  sentiment:
    <<: *application
    command: ["trading-sentiment"]
    ports:
      - ${TRADING_SENTIMENT_METRICS_BIND:-127.0.0.1}:9109:9109
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/trading-sentiment-health && find /tmp/trading-sentiment-health -mmin -30 | grep -q .
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 128m
    cpus: 0.25
    logging:
      options:
        max-size: 10m
        max-file: "3"

  macro:
    <<: *application
    command: ["trading-macro"]
    ports:
      - ${TRADING_MACRO_METRICS_BIND:-127.0.0.1}:9110:9110
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/trading-macro-health && find /tmp/trading-macro-health -mmin -720 | grep -q .
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5m
    mem_limit: 128m
    cpus: 0.25
    logging:
      options:
        max-size: 10m
        max-file: "3"

  equity:
    <<: *application
    command: ["trading-equity"]
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/trading-equity-health && find /tmp/trading-equity-health -mmin -1560 | grep -q .
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5m
    mem_limit: 192m
    cpus: 0.25
    logging:
      options:
        max-size: 10m
        max-file: "3"

  backtest:
    <<: *application
    command: ["trading-platform", "--help"]
    profiles: ["research"]
    volumes:
      - ${TRADING_DATA_ROOT:-/mnt/NVMe2/trading-platform}/parquet:/data/parquet:ro
      - ${TRADING_DATA_ROOT:-/mnt/NVMe2/trading-platform}/backtests:/data/backtests
    restart: "no"
    mem_limit: 2g
    cpus: 2.0

networks:
  trading_internal:
  dashboard_shared:
    external: true
    name: dashboard_shared

secrets:
  postgres_password:
    file: ${TRADING_POSTGRES_PASSWORD_SOURCE:-./secrets/postgres_password}
