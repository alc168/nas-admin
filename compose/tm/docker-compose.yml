# this is the docker compose file for the full automation stack.  Plex and Tautulli are for serving videos
# qbt-tl is for downloading movies and tv shows from Torrent Leech
# qbt-sports is for downloading F1, AFL, EPL from Sports Cult

services:
  # Downloaders - qbittorrent
  qbt-tl:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbt-tl
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
      - WEBUI_PORT=8080 
    volumes:
      - ~/config/qbt-tl:/config
      - /mnt:/mnt
    restart: unless-stopped

  # --- AUTOMATION (The Arrs) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
    volumes:
      - ~/config/sonarr:/config
      - /mnt:/mnt
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
    volumes:
      - ~/config/radarr:/config
      - /mnt:/mnt
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
    volumes:
      - ~/config/prowlarr:/config
    restart: unless-stopped

  # --- FRONTEND & UTILITIES ---
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true  # Required for Seerr v3.0+
    environment:
      - TZ=Australia/Melbourne
      - LOG_LEVEL=info
    ports:
      - 5055:5055
    volumes:
      - ~/config/overseerr:/app/config

  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
    volumes:
      - ~/config/autobrr:/config
    restart: unless-stopped

  kometa:
    image: kometateam/kometa
    container_name: kometa
    environment:
      - PUID=1000  
      - PGID=1000
      - TZ=Australia/Melbourne
      - KOMETA_TIMES=03:00  # Runs once a day at 3 AM
    volumes:
      - ~/config/kometa:/config:rw
    restart: unless-stopped

  # --- IMMICH ECOSYSTEM ---
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - /mnt/storage/jez-photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2283:2283
    devices:
      - /dev/dri:/dev/dri # Intel QuickSync
    depends_on:
      - redis
      - database
    restart: always
    networks:
      - immich-network

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - /jez-cache/immich/model-cache:/cache
    env_file:
      - .env
    restart: always
    networks:
      - immich-network

  redis:
    container_name: immich_redis
    image: registry.hub.docker.com/library/redis:6.2-alpine
    restart: always
    networks:
      - immich-network

  database:
    container_name: immich_postgres
    # image: registry.hub.docker.com/tensorchord/pgvecto-rs:pg14-v0.2.0
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - /jez-cache/immich/postgres:/var/lib/postgresql/data
      - /mnt:/mnt
    # added this shm_size per upgrade instructions
    shm_size: 128mb
    restart: always
    networks:
      - immich-network

  immich-power-tools:
    container_name: immich_power_tools
    image: ghcr.io/varun-raj/immich-power-tools:latest
    ports:
      - "8001:3000"
    env_file:
      - .env
    environment:
      - IMMICH_URL=${IMMICH_URL}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - POWER_TOOLS_ENDPOINT_URL=${POWER_TOOLS_ENDPOINT_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME} 
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://172.19.0.5:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - immich-network

  # --- MEDIA SERVER ---
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex2
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./config:/config
      - /mnt/:/mnt
      - /mnt/storage/plex-mobile:/plex-mobile
      - /mnt/storage/plex-movies:/plex-movies
      - /mnt/storage/plex-tv:/plex-tv      
      - /mnt/temp:/temp                 
    devices:
      - /dev/dri:/dev/dri # Intel Hardware Transcoding
    restart: unless-stopped
  # Image editor bitmappery
  bitmappery-init:
    image: alpine
    # This matches the folder Vite is trying to write to
    command: sh -c "chown -R 1000:1000 /usr/src/app"
    volumes:
      - bitmappery_data:/usr/src/app

  bitmappery:
    container_name: bitmappery
    build: https://github.com/igorski/bitmappery.git
    # Run as a standard, non-root user (1000 is usually the default 'node' user)
    user: "1000:1000" 
    ports:
      - "5173:5173"
    volumes:
      - bitmappery_data:/usr/src/app
    depends_on:
      - bitmappery-init
    restart: unless-stopped

volumes:
  bitmappery_data:

networks:
  immich-network:
    external: false

