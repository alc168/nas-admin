# Network Monitoring Stack - Simplified
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "1000:1000"
    volumes:
      - /home/tm/config/prometheus:/etc/prometheus
      - /home/tm/data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=365d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    user: "1000:1000"
    volumes:
      - /home/tm/config/alertmanager:/etc/alertmanager
      - /home/tm/data/alertmanager:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "1000:1000"
    volumes:
      - /home/tm/config/grafana:/var/lib/grafana
      # Datasource provisioning (Loki added 2026-09-16).
      - /home/tm/config/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=\${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://192.168.0.172:3001
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - monitoring

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped
    networks:
      - monitoring

  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    restart: unless-stopped
    ports:
      - "9130:9130"
    environment:
      - UP_UNIFI_DEFAULT_URL=https://192.168.0.250
      - UP_UNIFI_DEFAULT_USER=prometheus
      - UP_UNIFI_DEFAULT_PASS=\${UP_UNIFI_DEFAULT_PASS}
      - UP_UNIFI_DEFAULT_VERIFY_SSL=false
      - UP_UNIFI_DEFAULT_SAVE_SITES=true
      - UP_UNIFI_DEFAULT_SAVE_DPI=true
      - UP_UNIFI_DEFAULT_SAVE_CLIENTS=true
      - UP_PROMETHEUS_HTTP_LISTEN=0.0.0.0:9130
      - UP_PROMETHEUS_NAMESPACE=unpoller
      - UP_INFLUXDB_DISABLE=true
      # UniFi events, alarms, anomalies and IDS/IPS hits -> Loki (log side).
      # Prometheus keeps getting the metrics as before.
      - UP_LOKI_URL=http://loki:3100
      - UP_LOKI_VERIFY_SSL=false
      - UP_LOKI_INTERVAL=2m
      - UP_LOKI_TIMEOUT=30s
    networks:
      - monitoring

  # --- Log storage + collection (added 2026-09-16) -------------------------
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "1000:1000"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - /home/tm/config/loki:/etc/loki
      - /mnt/NVMe2/loki:/loki
    ports:
      # Loopback only — Grafana reaches it over the compose network.
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    # root: needs the docker socket, container log files and the host journal.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /home/tm/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /home/tm/data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      # Syslog in from the UniFi Dream Wall (192.168.0.250).
      - "514:1514/udp"
      - "514:1514/tcp"
      # Alloy's own UI — loopback only.
      - "127.0.0.1:12345:12345"
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
