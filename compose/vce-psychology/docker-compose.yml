services:
  vce:
    build: .
    image: vce-psychology:latest
    container_name: vce-psychology
    restart: unless-stopped
    # 8137 was chosen because terramaster already serves 80, 443, 3000-3002,
    # 4000-4002, 5055, 5173, 8000, 8001, 8080, 8088, 9090, 9093 and 9130.
    ports:
      - "8137:8137"
    volumes:
      # The database and the activity log: progress, flashcard scheduling, AI metrics.
      - vce-data:/data
      # API keys, edited directly on the host. Read-only to the
      # container, and re-read whenever the file changes — no restart needed.
      # Set VCE_CONFIG_DIR to keep the config somewhere sudo isn't needed.
      - ${VCE_CONFIG_DIR:-/opt/vce/config}:/config:ro
    environment:
      TZ: Australia/Melbourne
      # Model calls and study events, one JSON line each, rotated at 5 MB.
      VCE_LOG: /data/activity.log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8137/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vce-data:
